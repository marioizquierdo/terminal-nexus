name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate repository
        run: ./scripts/check-repository.sh

  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test on Node
        run: npm test

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # Cross-runtime agreement is the only cheap test of the serialization and iteration
      # assumptions that many runs on one runtime can never catch.
      - name: Test on Bun
        run: npm run test:bun

      - name: Verify every scenario resolves identically
        run: |
          for scenario in scenarios/*.ts; do
            ./bin/grid.ts verify "$scenario" --runs 20
          done
